services:
  # ==============================================================================
  # 1. MySQL 8.4 Database Container
  # ==============================================================================
  mysql:
    image: mysql:8.4
    container_name: sms-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sms_db}
      MYSQL_USER: ${DB_USER:-sms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecureDbPass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSuperSecure2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sms-network

  # ==============================================================================
  # 2. Spring Boot 4 Backend Container (Java 21)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sms_db}
      DB_USER: ${DB_USER:-sms_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecureDbPass2026!}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-sms_db}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sms_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-SecureDbPass2026!}
      JWT_SECRET: ${JWT_SECRET:-4f8b9a1e7c3d2f0a5b6c8d9e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecure2026!}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/ping > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - sms-network

  # ==============================================================================
  # 3. React Frontend + Nginx Web Server Container
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - sms-network

  # ==============================================================================
  # 4. Prometheus Metrics & Observability (Port 9090)
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sms-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - sms-network

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  mysql_data:
    driver: local

networks:
  sms-network:
    driver: bridge
