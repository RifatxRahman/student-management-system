spring:
  application:
    name: studentmanagement
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sms_db}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never


app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
    cookie-secure: false
    max-failed-attempts: 5
    lock-minutes: 15
  bootstrap:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}

  attendance:
    edit-window-days: 3
    weekly-off-days: FRIDAY

  sms:
    enabled: false
    provider: greenweb
    api-url: "http://api.greenweb.com.bd/api.php"
    token: ${SMS_API_TOKEN:}
    default-language: "BN"
    cost-per-sms: 0.25
    scheduler-enabled: true

  institution:
    name: "আদর্শ উচ্চ বিদ্যালয়"
    address: "ঢাকা, বাংলাদেশ"
    phone: "০১৭১২-৩৪৫৬৭৮"

  result:
    optional-base-gpa: 2.00
    max-gpa: 5.00