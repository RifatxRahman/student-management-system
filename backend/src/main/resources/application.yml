spring:
  application:
    name: studentmanagement
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:sms_db}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never


app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
    cookie-secure: false
    max-failed-attempts: 5
    lock-minutes: 15
  bootstrap:
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}